services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitgo
      POSTGRES_USER: splitgo
      POSTGRES_PASSWORD: splitgo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - splitgo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitgo -d splitgo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  splitgo_postgres:
